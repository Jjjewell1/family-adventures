<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — Family Adventures</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --forest-500: #3B6F54;
      --forest-100: #D0E7D9;
      --cream-50: #FBF7F0;
      --cream-200: #F4EDE2;
      --ink-600: #4A4540;
      --ink-800: #363530;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      background: var(--cream-50);
      color: var(--ink-800);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4C8567, #3B6F54);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .logo svg { width: 40px; height: 40px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: var(--ink-600); margin: 0 0 24px; }
    .status {
      font-size: 13px; color: var(--forest-500); background: var(--forest-100);
      padding: 8px 14px; border-radius: 999px; margin: 0 auto 24px; width: fit-content;
    }
    button {
      background: var(--forest-500); color: #fff;
      border: none; border-radius: 12px;
      padding: 13px 28px; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    .hint { margin-top: 18px; font-size: 12px; color: var(--ink-600); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M12 44 L24 26 L32 38 L38 30 L52 44 Z" fill="#FBF7F0"/>
        <circle cx="44" cy="18" r="5" fill="#FBF7F0"/>
        <path d="M20 50 L44 50" stroke="#A2CFAF" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Adventures you've already opened are still available.</p>
    <div class="status">No internet connection</div>
    <button type="button" onclick="window.location.reload()">Try Again</button>
    <p class="hint">Family Adventures</p>
  </main>
</body>
</html>
